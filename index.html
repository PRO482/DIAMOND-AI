    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: white;
      }
      .rainbow-text {
        background: linear-gradient(to right, #ef4444, #f97316, #facc15, #4ade80, #3b82f6, #8b5cf6, #d946ef);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        color: transparent;
      }
      .rainbow-border {
        border-image: linear-gradient(to right, #ef4444, #f97316, #facc15, #4ade80, #3b82f6, #8b5cf6, #d946ef) 1;
      }
      @keyframes gradient-move {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .animated-rainbow {
        background: linear-gradient(270deg, #ef4444, #f97316, #facc15, #4ade80, #3b82f6, #8b5cf6, #d946ef);
        background-size: 400% 400%;
        animation: gradient-move 15s ease infinite;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
